name: tests

on:
  push:
    branches: [main, onda-*, feature/*]
  pull_request:
    branches: [main]

jobs:
  pytest-engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy networkx nashpy
          # FastAPI e pydantic são requeridos p/ importar engine.cognitivo.integracoes_onda10
          pip install fastapi pydantic
          # weasyprint é opcional (apenas p/ PDF)

      - name: Run Onda 10 — game theory
        env: { PYTHONPATH: "." }
        run: python tests/test_game_theory.py

      - name: Run Onda 10 — opinion dynamics
        env: { PYTHONPATH: "." }
        run: python tests/test_opinion_dynamics.py

      - name: Run Onda 10 — simulação avançada
        env: { PYTHONPATH: "." }
        run: python tests/test_simulacao_avancada.py

      - name: Run Onda 10 — psico-história
        env: { PYTHONPATH: "." }
        run: python tests/test_psicohistoria.py

      - name: Run Onda 10.2 — crença tracker
        env: { PYTHONPATH: "." }
        run: python tests/test_crenca.py

      - name: Run Onda 5 — proveniência + backtest
        env: { PYTHONPATH: "." }
        run: python tests/test_proveniencia.py

      - name: Run Onda 6 — GraphRAG
        env: { PYTHONPATH: "." }
        run: python tests/test_grafo_conhecimento.py

      - name: Run Onda 7 — multi-plataforma
        env: { PYTHONPATH: "." }
        run: python tests/test_plataformas.py

      - name: Run Ondas 5-9 — integrado
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_5_a_9.py

  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Compile all engine modules
        run: |
          python -m py_compile $(find engine -name "*.py")
          python -m py_compile $(find api -name "*.py") || true
          python -m py_compile main.py config.py

  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Check Web Components + JS modules
        run: |
          for f in frontend/js/*.js frontend/components/*.js; do
            node --check "$f"
          done
