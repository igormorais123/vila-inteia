name: tests

on:
  push:
    branches: [main, onda-*, feature/*]
  pull_request:
    branches: [main]

jobs:
  pytest-engine:
    name: Engine tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy networkx nashpy
          # FastAPI e pydantic são requeridos p/ importar engine.cognitivo.integracoes_onda10
          pip install fastapi pydantic
          # weasyprint é opcional (apenas p/ PDF)

      - name: Run Onda 10 — game theory
        env: { PYTHONPATH: "." }
        run: python tests/test_game_theory.py

      - name: Run Onda 10 — opinion dynamics
        env: { PYTHONPATH: "." }
        run: python tests/test_opinion_dynamics.py

      - name: Run Onda 10 — simulação avançada
        env: { PYTHONPATH: "." }
        run: python tests/test_simulacao_avancada.py

      - name: Run Onda 10 — psico-história
        env: { PYTHONPATH: "." }
        run: python tests/test_psicohistoria.py

      - name: Run Onda 10.2 — crença tracker
        env: { PYTHONPATH: "." }
        run: python tests/test_crenca.py

      - name: Run Onda 5 — proveniência + backtest
        env: { PYTHONPATH: "." }
        run: python tests/test_proveniencia.py

      - name: Run Onda 6 — GraphRAG
        env: { PYTHONPATH: "." }
        run: python tests/test_grafo_conhecimento.py

      - name: Run Onda 7 — multi-plataforma
        env: { PYTHONPATH: "." }
        run: python tests/test_plataformas.py

      - name: Run Ondas 5-9 — integrado
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_5_a_9.py

      - name: Run Onda 11 — detector estado
        env: { PYTHONPATH: "." }
        run: python tests/test_detector_estado_vila.py

      - name: Run Ondas 13-16
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_13_a_16.py

      - name: Run Ondas 17-19
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_17_19.py

      - name: Run Onda 20 replay
        env: { PYTHONPATH: "." }
        run: python tests/test_replay.py

      - name: Run Ondas 22-24
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_22_24.py

      - name: Run Ondas 25-27
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_25_27.py

      - name: Run Ondas 28-30
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_28_30.py

      - name: Run Onda 31 event log
        env: { PYTHONPATH: "." }
        run: python tests/test_event_log.py

      - name: Run Onda 35 meta-análise
        env: { PYTHONPATH: "." }
        run: python tests/test_meta_analise.py

      - name: Run Ondas 37-39
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_37_39.py

      - name: Run Ondas 40-42
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_40_42.py

      - name: Run Ondas 43-45
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_43_45.py

      - name: Run Ondas 46-48
        env: { PYTHONPATH: "." }
        run: python tests/test_ondas_46_48.py

  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Compile all engine modules
        run: |
          python -m py_compile $(find engine -name "*.py")
          python -m py_compile $(find api -name "*.py") || true
          python -m py_compile main.py config.py

  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Check Web Components + JS modules
        run: |
          for f in frontend/js/*.js frontend/components/*.js; do
            node --check "$f"
          done
