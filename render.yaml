services:
  - type: web
    name: vila-inteia
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py live --port $PORT --intervalo 60 --topico "futuro da inteligencia artificial no Brasil"
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMNIROUTE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: IA_ALLOW_API_FALLBACK
        value: "false"
